# Tareas programadas: despierta el servidor y le pide hacer lo que corresponda según la hora de Chile.
#  - 11:00 y 16:00 Chile: revisa licitaciones y Compra Ágil nuevas en Mercado Público.
#  - Mañana (~08:00 Chile): envía por correo el resumen de licitaciones nuevas y el respaldo semanal.
# GitHub usa hora UTC: 14:00 y 15:00 UTC (11:00 en verano / 11:00 en invierno), 19:00 y 20:00 UTC (16:00 verano / invierno);
# la llamada que sobra no hace nada porque el servidor revisa la hora de Chile. 11:00 UTC = correo de la mañana.
# Ver inventario-backend/src/routes/tareas.js.
name: Tareas diarias
on:
  schedule:
    - cron: "3 14 * * *"
    - cron: "3 15 * * *"
    - cron: "3 19 * * *"
    - cron: "3 20 * * *"
    - cron: "3 11 * * *"
  workflow_dispatch: {}
jobs:
  tareas:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el servidor
        run: curl -s -m 120 https://inventario-kennot-backend.onrender.com/ || true
      - name: Ejecutar tareas
        run: |
          sleep 20
          curl -s -m 120 -X POST https://inventario-kennot-backend.onrender.com/api/tareas
